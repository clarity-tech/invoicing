# Cloud Run service: private queue handler for InvoiceInk.
#
# Cloud Tasks POSTs serialised jobs here with a Google-signed OIDC token. The
# package does NOT verify that token itself (SIGNED_AUDIENCE was removed in v4),
# so Cloud Run IAM is the only authentication boundary. After applying, grant
# invoke rights to the Cloud Tasks identity ONLY:
#
#   gcloud run services add-iam-policy-binding invoicing-worker \
#     --region=$REGION \
#     --member=serviceAccount:invoicing-tasks-invoker@$PROJECT.iam.gserviceaccount.com \
#     --role=roles/run.invoker
#
# Placeholder tokens are the same set documented in web.yaml.
#
# See docs/cloud_run_deployment_plan.md §9
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: invoicing-worker
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: invoicing-app@__PROJECT__.iam.gserviceaccount.com
      # One job at a time. Chromium is memory-hungry and two concurrent PDF
      # renders on one instance would contend. The Cloud Tasks queue is
      # configured with --max-concurrent-dispatches=1 to match, so the queue
      # buffers instead of generating 429s.
      containerConcurrency: 1
      timeoutSeconds: 900
      containers:
        - name: app
          image: __REGION__-docker.pkg.dev/__PROJECT__/docker/invoicing:__TAG__
          # Still required: with sidecars there is no default ingress port.
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: APP_NAME
              value: InvoiceInk
            # Must be the public domain, not this service's run.app URL:
            # DocumentMailer::getPublicViewUrl() calls route() here, and those
            # links are emailed to customers.
            - name: APP_URL
              value: https://invoiceink.claritytech.io
            - name: MAIL_FROM_NAME
              value: InvoiceInk
            - name: OCTANE_HTTPS
              value: "true"
            # containerConcurrency is 1, so additional workers would only sit
            # idle holding memory and a database connection.
            - name: OCTANE_WORKERS
              value: "1"
            - name: OCTANE_MAX_EXECUTION_TIME
              value: "300"
            - name: LOG_CHANNEL
              value: stderr

            - name: GOTENBERG_URL
              value: http://localhost:3000
            - name: GOTENBERG_TIMEOUT
              value: "90"

            # This is the service that actually runs jobs.
            - name: CLOUD_TASKS_DISABLE_TASK_HANDLER
              value: "false"
            - name: QUEUE_CONNECTION
              value: cloudtasks
            - name: CLOUD_TASKS_PROJECT
              value: __PROJECT__
            - name: CLOUD_TASKS_LOCATION
              value: __REGION__
            - name: CLOUD_TASKS_QUEUE
              value: invoicing-default
            - name: CLOUD_TASKS_SERVICE_EMAIL
              value: invoicing-tasks-invoker@__PROJECT__.iam.gserviceaccount.com
            # Set here too so a job dispatched from within a job lands back on
            # this service rather than the public one.
            - name: CLOUD_TASKS_HANDLER
              value: __WORKER_URL__

            - name: CACHE_STORE
              value: database
            - name: SESSION_DRIVER
              value: database
            - name: FILESYSTEM_DISK
              value: s3

            # AWS S3 proper — AWS_ENDPOINT stays unset and path-style stays off.
            - name: AWS_ACCESS_KEY_ID
              value: __AWS_KEY_ID__
            - name: AWS_DEFAULT_REGION
              value: __AWS_REGION__
            - name: AWS_BUCKET
              value: __AWS_BUCKET__
            - name: AWS_URL
              value: __AWS_URL__

            # This service is the one that actually sends invoice mail.
            - name: MAIL_MAILER
              value: smtp
            - name: MAIL_HOST
              value: __MAIL_HOST__
            - name: MAIL_PORT
              value: "__MAIL_PORT__"
            - name: MAIL_USERNAME
              value: __MAIL_USER__
            - name: MAIL_FROM_ADDRESS
              value: __MAIL_FROM__

            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: __DB_HOST__
            - name: DB_PORT
              value: "__DB_PORT__"
            - name: DB_DATABASE
              value: __DB_NAME__
            - name: DB_USERNAME
              value: __DB_USER__
            - name: MYSQL_ATTR_SSL_CA
              value: __DB_SSL_CA__

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: APP_KEY
                  key: latest
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: DB_PASSWORD
                  key: latest
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: MAIL_PASSWORD
                  key: latest
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: AWS_SECRET_ACCESS_KEY
                  key: latest
          startupProbe:
            httpGet:
              path: /up
            periodSeconds: 5
            failureThreshold: 30

        - name: gotenberg
          image: __REGION__-docker.pkg.dev/__PROJECT__/docker/gotenberg:8
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --api-timeout=60s
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
