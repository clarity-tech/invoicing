# Cloud Run service: staging environment for exercising the MCP server against
# production-shaped infrastructure without touching production.
#
# Renders with the same script as the other manifests:
#
#   STAGING_DB_NAME=invoiceink_staging ./deploy/cloudrun/render.sh mcp-staging > /tmp/mcp-staging.yaml
#   gcloud run services replace /tmp/mcp-staging.yaml --region=asia-south1 --project=invoiceink
#
# Placeholder tokens (see render.sh):
#
#   __PROJECT__          GCP project id
#   __REGION__           Cloud Run region
#   __TAG__              image tag, normally the SHA
#   __DB_HOST__          MySQL host — same server as production
#   __STAGING_DB_NAME__  a SEPARATE schema on that server, never the production one
#   __STAGING_DB_USER__  a dedicated user granted only on that schema
#
# STAGING_URL is optional and so is deliberately absent from the list above:
# tokens named in these comments are not substituted, and an optional one would
# survive as a literal placeholder and fail the render.
#
# ---------------------------------------------------------------------------
# What keeps this from affecting production
# ---------------------------------------------------------------------------
#
# A separate database is necessary but not sufficient. Three further things are
# deliberately severed, because each one could otherwise reach the real world:
#
#   1. QUEUE_CONNECTION=sync. Production uses push-based Cloud Tasks. If this
#      service enqueued onto the production queue, the *production* worker would
#      pick the jobs up and run them against the production database. Sync keeps
#      every job inside this container.
#
#   2. MAIL_MAILER=log. Invoicing emails real customers. A staging service with
#      working SMTP is one accidental send away from mailing them. Nothing here
#      needs delivery, so nothing is delivered.
#
#   3. A distinct APP_KEY secret. Sharing production's key would mean a
#      compromise of a lower-trust environment yields the key that decrypts
#      production data.
#
# APP_ENV stays "production" on purpose. Using "staging" would flip
# app()->isProduction() to false, which re-enables the MCP_LOCAL_USER_EMAIL
# fallback in ResolvesActingOrganization. That fallback is unreachable over HTTP
# (auth:api rejects first) but the gate is environment-name-based, so the
# safer and higher-fidelity choice is to leave the environment identical to
# production and distinguish this service by its name and database instead.
#
# The Gotenberg sidecar is present so the web UI can be exercised end to end —
# PDF rendering is central to invoicing and fails without it. It is the reason
# this service costs roughly twice what an MCP-only one would.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: invoicing-mcp-staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # Staging carries no traffic worth scaling for, and this caps the bill.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: invoicing-app@__PROJECT__.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 120
      containers:
        - name: app
          image: __REGION__-docker.pkg.dev/__PROJECT__/docker/invoicing:__TAG__
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: APP_NAME
              value: InvoiceInk (MCP staging)
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: __STAGING_URL__
            - name: LOG_CHANNEL
              value: stderr

            # The reason this service exists: a place to exercise the endpoint
            # against its own database. Production serves it too (web.yaml).
            - name: MCP_WEB_ENABLED
              value: "true"

            # Deliberately NOT set: MCP_LOCAL_USER_EMAIL. The stdio transport has
            # no place in a deployed service, and the acting user must come from
            # the bearer token.

            - name: OCTANE_HTTPS
              value: "true"
            - name: OCTANE_WORKERS
              value: "4"

            # Nothing leaves this container: no Cloud Tasks, no SMTP.
            - name: QUEUE_CONNECTION
              value: sync
            - name: CLOUD_TASKS_DISABLE_TASK_HANDLER
              value: "true"
            - name: MAIL_MAILER
              value: log

            - name: CACHE_STORE
              value: database
            - name: SESSION_DRIVER
              value: database

            # PDF rendering, via the sidecar below on localhost. The timeout
            # ladder must increase outward: Gotenberg --api-timeout 60s <
            # GOTENBERG_TIMEOUT 90s < timeoutSeconds. Every document is rendered
            # twice (once to count pages, then again to place the footer), so a
            # real invoice takes ~10s.
            - name: GOTENBERG_ENABLED
              value: "true"
            - name: GOTENBERG_URL
              value: http://localhost:3000
            - name: GOTENBERG_TIMEOUT
              value: "90"

            # Uploads share production's bucket, so they MUST be namespaced.
            # Media paths are keyed on the media row id, and this database
            # starts from id 1 — the same ids production already uses. Without
            # the prefix, the first staging logo upload would overwrite a
            # production one. DefaultPathGenerator::getBasePath() prepends this.
            - name: FILESYSTEM_DISK
              value: s3
            - name: MEDIA_DISK
              value: s3
            - name: MEDIA_PREFIX
              value: staging
            - name: AWS_ACCESS_KEY_ID
              value: __AWS_KEY_ID__
            - name: AWS_DEFAULT_REGION
              value: __AWS_REGION__
            - name: AWS_BUCKET
              value: __AWS_BUCKET__
            - name: AWS_URL
              value: __AWS_URL__

            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: __DB_HOST__
            - name: DB_PORT
              value: "__DB_PORT__"
            # A separate schema. This is the single most important line here.
            - name: DB_DATABASE
              value: __STAGING_DB_NAME__
            # A dedicated least-privilege account, granted only on the staging
            # schema. Reusing the production DB_PASSWORD secret would mean a
            # compromise of this lower-trust service yields credentials with
            # rights over the production database.
            - name: DB_USERNAME
              value: __STAGING_DB_USER__
            - name: MYSQL_ATTR_SSL_CA
              value: __DB_SSL_CA__

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: APP_KEY_STAGING
                  key: latest
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: DB_PASSWORD_STAGING
                  key: latest
            # Production's S3 credentials, deliberately: MEDIA_PREFIX is what
            # separates staging's objects, not a second bucket. Revisit if
            # staging ever needs to be lower-trust than the bucket itself.
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: AWS_SECRET_ACCESS_KEY
                  key: latest
            # A distinct pair, for the same reason as APP_KEY_STAGING: a token
            # signed here must never verify against production.
            - name: PASSPORT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: PASSPORT_PRIVATE_KEY_STAGING
                  key: latest
            - name: PASSPORT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: PASSPORT_PUBLIC_KEY_STAGING
                  key: latest
          startupProbe:
            httpGet:
              path: /up
            timeoutSeconds: 1
            periodSeconds: 1
            failureThreshold: 150

        - name: gotenberg
          image: __REGION__-docker.pkg.dev/__PROJECT__/docker/gotenberg:8
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --api-timeout=60s
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
