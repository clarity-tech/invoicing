# Run an artisan command against production from the Actions tab.
#
# Cloud Run has no shell to attach to, so commands run as a Cloud Run Job
# execution with its arguments overridden. This wraps deploy/cloudrun/artisan.sh
# rather than reimplementing it, so the CI path and the local path stay
# identical.
#
# Two things to know about the environment it runs in:
#   - Jobs have no Gotenberg sidecar, so anything rendering a PDF will fail.
#   - Runs are non-interactive, so any confirm() takes its default answer. That
#     is why ProductionSeeder reports success while seeding nothing; call
#     ProductionUserSeeder / ProductionCustomerSeeder / ProductionInvoiceSeeder
#     directly instead.

name: Artisan (production)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Artisan command, e.g. "migrate:status" or "db:seed --class=ProductionUserSeeder --force"'
        required: true
        type: string
      acknowledge_destructive:
        description: "Required only for destructive commands (migrate:fresh, db:wipe, migrate:reset/rollback)"
        required: false
        default: false
        type: boolean

concurrency:
  group: artisan-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Uses the same environment as deploy-production, so if you add required
    # reviewers there, they gate this too.
    environment: production
    permissions:
      contents: read
      id-token: write

    env:
      # Passed through the environment rather than interpolated into the script,
      # so a command containing shell metacharacters cannot alter the workflow.
      COMMAND: ${{ inputs.command }}
      ACK: ${{ inputs.acknowledge_destructive }}
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      DEPLOY_ENV_FILE: /dev/null

    steps:
      - uses: actions/checkout@v6

      - name: Guard destructive commands
        run: |
          set -euo pipefail
          if grep -qE '(^|[[:space:]])(migrate:fresh|migrate:reset|migrate:rollback|db:wipe)([[:space:]]|$)' <<<"$COMMAND"; then
            echo "::warning::'$COMMAND' is destructive."
            if [ "$ACK" != "true" ]; then
              echo "::error::Refusing to run a destructive command without acknowledge_destructive=true." >&2
              echo "Re-run the workflow and tick the acknowledgement box." >&2
              exit 1
            fi
            echo "Acknowledgement given; proceeding."
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run
        run: |
          set -euo pipefail
          chmod +x deploy/cloudrun/artisan.sh
          # Word-split the command the same way a shell would, so quoted
          # arguments containing spaces survive.
          eval "set -- $COMMAND"
          ./deploy/cloudrun/artisan.sh --logs "$@" | tee /tmp/artisan.out

      - name: Summary
        if: always()
        run: |
          {
            echo "### \`php artisan $COMMAND\`"
            echo
            echo "Run by @${{ github.actor }} against \`${{ vars.GCP_PROJECT }}\` / \`${{ vars.GCP_REGION }}\`."
            echo
            echo '```'
            sed -n '/--- output ---/,$p' /tmp/artisan.out 2>/dev/null | head -80 || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
